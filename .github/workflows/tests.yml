name: Persistence Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  esp32-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-Persistence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create consumer project
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = espressif32
          board = esp32dev
          framework = arduino
          build_flags = -std=gnu++17
          build_unflags = -std=gnu++11
          lib_deps = ../ESPressio-Persistence
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_ESP32Persistence.hpp>
          using namespace ESPressio::Persistence;
          LittleFSStorage littlefs(false);
          SPIFFSStorage spiffs(false);
          FFatStorage ffat(false);
          PreferencesStorage preferences("test");
          SDStorage sd(5);
          SDMMCStorage sdmmc(true);
          void setup() {
              (void)littlefs.GetCapabilities();
              (void)spiffs.GetCapabilities();
              (void)ffat.GetCapabilities();
              (void)preferences.GetCapabilities();
              (void)sd.GetCapabilities();
              (void)sdmmc.GetCapabilities();
          }
          void loop() {}
          EOF
      - name: Compile ESP32 backend surface
        run: pio run -d project/compile
