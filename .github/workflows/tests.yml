name: Persistence Tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-Persistence
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: feature/1-system-memory-policy
          path: project/ESPressio-System
      - name: Configure
        run: >-
          cmake -S project/ESPressio-Persistence
          -B project/ESPressio-Persistence/build
          -DESPRESSIO_SYSTEM_SOURCE_DIR="$PWD/project/ESPressio-System"
      - name: Build
        run: cmake --build project/ESPressio-Persistence/build --parallel
      - name: Test
        run: ctest --test-dir project/ESPressio-Persistence/build --output-on-failure

  serializable-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-Persistence
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Serializable
          ref: optimisation/25-psram-buffers
          path: project/ESPressio-Serializable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Security
          ref: optimisation/23-memory-policy-transient-buffers
          path: project/ESPressio-Security
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: feature/1-system-memory-policy
          path: project/ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: feature/16-rtti-free-observer-registry
          path: project/ESPressio-Observable
      - name: Compile Serializable persistence tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-error=misleading-indentation \
            -I project/ESPressio-Persistence/src \
            -I project/ESPressio-Serializable/src \
            -I project/ESPressio-System/src \
            project/ESPressio-Persistence/tests/serializable_persistence_tests.cpp \
            -o project/serializable_persistence_tests
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-error=misleading-indentation \
            -I project/ESPressio-Persistence/src \
            -I project/ESPressio-Serializable/src \
            -I project/ESPressio-Security/src \
            -I project/ESPressio-System/src \
            -I project/ESPressio-Observable/src \
            project/ESPressio-Persistence/tests/protected_serializable_persistence_tests.cpp \
            -o project/protected_serializable_persistence_tests
      - name: Run Serializable persistence tests
        run: |
          project/serializable_persistence_tests
          project/protected_serializable_persistence_tests

  esp32-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-Persistence
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Serializable
          ref: optimisation/25-psram-buffers
          path: project/ESPressio-Serializable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Security
          ref: optimisation/23-memory-policy-transient-buffers
          path: project/ESPressio-Security
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: feature/16-rtti-free-observer-registry
          path: project/ESPressio-Observable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: feature/1-system-memory-policy
          path: project/ESPressio-System
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Create consumer project
        shell: bash
        run: |
          mkdir -p project/compile/src
          cat > project/compile/platformio.ini <<'EOF'
          [env:esp32]
          platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
          board = esp32dev
          framework = arduino
          build_flags = -std=gnu++17 -frtti
          build_unflags = -std=gnu++11 -fno-rtti
          lib_deps =
              ../ESPressio-Persistence
              ../ESPressio-Serializable
              ../ESPressio-Security
              ../ESPressio-Observable
              ../ESPressio-System
          EOF
          cat > project/compile/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <ESPressio_Persistence.hpp>
          #include <ESPressio_Persistence_Serializable.hpp>
          #include <ESPressio_Persistence_Serializable_Security.hpp>
          #include <ESPressio_Security.hpp>

          using namespace ESPressio;
          using namespace ESPressio::Persistence;

          class Configuration final : public Serializable::Serializable<Configuration> {
              ESPRESSIO_SERIALIZABLE_TYPE(Configuration)
              ESPRESSIO_SERIALIZABLE_SCHEMA_VERSION(1)
          private:
              uint32_t _counter = 0;
          public:
              ESPRESSIO_SERIALIZABLE_PROPERTIES(ESPRESSIO_PROPERTY("counter", _counter))
          };

          MemoryFileStorage files;
          MemoryKeyValueStorage values;
          Security::AES256GCMCipher cipher;
          Security::AeadCipherRegistry ciphers;
          Security::StaticKeyProvider keys;
          Security::RandomSource randomSource;

          void setup() {
              uint8_t key[32]{};
              (void)files.Initialize();
              (void)values.Initialize();
              ciphers.Register(cipher);
              keys.Add(1, Security::AeadAlgorithm::AES256GCM, key, sizeof(key));
              Security::DataProtector protector(ciphers, keys, randomSource);
              Serializable::SerializationProtectionConfig protection(protector, "test.config");
              Configuration value;
              (void)SaveSerializable(files, "/value.bin", value, protection);
              (void)LoadSerializable(files, "/value.bin", value, protection);
              (void)SaveSerializable(values, "value", value, protection);
              (void)LoadSerializable(values, "value", value, protection);
          }
          void loop() {}
          EOF
      - name: Compile ESP32 protected Serializable surface
        run: pio run -d project/compile
